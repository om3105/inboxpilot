services:
  - type: web
    name: inboxpilot
    env: python
    runtime: python
    region: oregon
    plan: free
    buildCommand: "pip install -r requirements.txt"
    startCommand: "uvicorn app.main:app --host 0.0.0.0 --port $PORT"
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.11
      - key: GEMINI_API_KEY
        sync: false
      - key: LLM_MODEL_NAME
        value: gemini-2.0-flash
      - key: MONGODB_URI
        sync: false
      - key: MONGODB_DB_NAME
        value: inboxpilot
      - key: LANGFUSE_PUBLIC_KEY
        sync: false
      - key: LANGFUSE_SECRET_KEY
        sync: false
      - key: LANGFUSE_HOST
        value: https://cloud.langfuse.com
      - key: DEMO_TOKEN
        generateValue: true
